name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/anideck
            git pull origin main
            docker build -t anideck .
            cd ~/infra
            docker compose up -d --force-recreate anideck
            # O worker usa a mesma imagem. Só é recriado se o serviço já existir no
            # compose do servidor; sem ele, o deploy do site segue normal.
            if docker compose config --services | grep -qx anideck-worker; then
              docker compose up -d --force-recreate anideck-worker
            fi
            docker image prune -f
