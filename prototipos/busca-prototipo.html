<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniDeck — Busca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0A0714; --panel:#130F22; --panel-2:#181330; --line:#2B2247;
    --text:#F1EEFA; --muted:#A79BC9; --muted-2:#6B5F94;
    --holo-1:#FF4FD8; --holo-2:#7B5CFF; --holo-3:#3FE0F0; --gold:#FFC542;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--void); color:var(--text); font-family:'Manrope',sans-serif; -webkit-font-smoothing:antialiased;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Anton',sans-serif; font-weight:400;}
  .holo-text{background:linear-gradient(90deg, var(--holo-1), var(--holo-2) 45%, var(--holo-3)); -webkit-background-clip:text; background-clip:text; color:transparent;}

  /* demo toggle bar (só pra visualizar os estados, não faz parte do produto) */
  .demo-bar{position:fixed; top:0; left:0; right:0; z-index:100; background:#000; padding:10px 16px; display:flex; gap:8px; flex-wrap:wrap; border-bottom:1px solid var(--line);}
  .demo-bar button{font-family:'JetBrains Mono',monospace; font-size:11px; padding:7px 12px; border-radius:99px; border:1px solid var(--line); background:var(--panel); color:var(--muted); cursor:pointer;}
  .demo-bar button.active{background:linear-gradient(90deg, var(--holo-1), var(--holo-2)); color:#fff; border-color:transparent;}

  .search-screen{padding:64px 20px 40px; max-width:960px; margin:0 auto;}
  .search-bar{
    display:flex; align-items:center; gap:12px; background:var(--panel); border:2px solid var(--holo-2);
    border-radius:14px; padding:14px 18px; margin-bottom:30px;
  }
  .search-bar input{background:none; border:none; outline:none; color:var(--text); font-size:16px; width:100%; font-family:'Manrope',sans-serif;}
  .search-bar input::placeholder{color:var(--muted-2);}

  .shelf-label{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--holo-3); letter-spacing:.1em; margin:0 0 14px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:14px;}

  .card{position:relative; aspect-ratio:2/3; border-radius:12px; overflow:hidden; border:1px solid var(--line);}
  .card.c1{background:linear-gradient(155deg, #3a1a4a, #120b22 75%);}
  .card.c2{background:linear-gradient(155deg, #1a3d4a, #120b22 75%);}
  .card.c3{background:linear-gradient(155deg, #4a1a2f, #120b22 75%);}
  .card.c4{background:linear-gradient(155deg, #1a2f4a, #120b22 75%);}
  .card.c5{background:linear-gradient(155deg, #2f4a1a, #120b22 75%);}
  .card .info{position:absolute; bottom:0; left:0; right:0; padding:10px; background:linear-gradient(0deg, rgba(0,0,0,.75), transparent);}
  .card .t{font-weight:700; font-size:12.5px; line-height:1.2;}
  .card .y{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--muted); margin-top:2px;}
  .add-btn{
    position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:50%;
    background:rgba(10,7,20,.7); border:1.5px solid rgba(255,255,255,.4); color:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:17px; font-weight:700;
    backdrop-filter:blur(4px); transition:all .2s;
  }
  .add-btn:hover{background:linear-gradient(90deg, var(--holo-1), var(--holo-2)); border-color:transparent;}

  .skeleton{background:linear-gradient(100deg, var(--panel) 30%, var(--panel-2) 50%, var(--panel) 70%); background-size:200% 100%; animation:shimmer 1.4s infinite;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

  .empty-state{text-align:center; padding:60px 20px; color:var(--muted);}
  .empty-state h3{font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase; color:var(--text); margin:14px 0 8px;}

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:28px; max-width:340px; text-align:center;}
  .modal h3{font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase; margin:0 0 10px;}
  .modal p{color:var(--muted); font-size:14px; margin:0 0 20px;}
  .modal .btn{display:block; width:100%; padding:12px; border-radius:99px; font-weight:800; margin-bottom:10px; background:linear-gradient(90deg, var(--holo-1), var(--holo-2)); color:#0A0714;}
  .modal .btn.ghost{background:none; border:1px solid var(--line); color:var(--muted);}

  .popover{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; max-width:280px;}
  .popover h4{font-size:13px; margin:0 0 12px; color:var(--muted);}
  .popover .opt{display:flex; align-items:center; gap:10px; padding:10px; border-radius:10px; font-size:13.5px; font-weight:600; cursor:pointer;}
  .popover .opt:hover{background:var(--panel-2);}
  .popover .opt .dot{width:8px; height:8px; border-radius:50%;}
</style>
</head>
<body>

<div class="demo-bar">
  <button class="active" data-state="empty">1. Vazio (sugestões)</button>
  <button data-state="typing">2. Digitando (skeleton)</button>
  <button data-state="results">3. Com resultados</button>
  <button data-state="noresults">4. Sem resultados</button>
  <button data-state="modal-logout">+ clicado (sem login)</button>
  <button data-state="modal-login">+ clicado (logado)</button>
</div>

<div class="search-screen" style="margin-top:40px;">
  <div class="search-bar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="Buscar anime, gênero, estúdio...">
  </div>

  <div id="content"></div>
</div>

<script>
const content = document.getElementById('content');
const input = document.getElementById('searchInput');

const cardsHTML = (n) => Array.from({length:n}).map((_,i) => `
  <div class="card c${(i%5)+1}">
    <span class="add-btn" data-add>+</span>
    <div class="info"><div class="t">Resultado ${i+1}</div><div class="y">TV · 2024</div></div>
  </div>
`).join('');

const skeletonHTML = (n) => Array.from({length:n}).map(() => `<div class="card skeleton"></div>`).join('');

const states = {
  empty: () => `
    <p class="shelf-label">// EM ALTA NESTA TEMPORADA</p>
    <div class="grid">${cardsHTML(5)}</div>
  `,
  typing: () => `
    <p class="shelf-label">// BUSCANDO...</p>
    <div class="grid">${skeletonHTML(5)}</div>
  `,
  results: () => `
    <p class="shelf-label">// RESULTADOS PARA "DR. STONE"</p>
    <div class="grid">${cardsHTML(8)}</div>
  `,
  noresults: () => `
    <div class="empty-state">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <h3>Nada encontrado</h3>
      <p>Confira a grafia, ou veja o que está em alta abaixo.</p>
    </div>
    <p class="shelf-label">// EM ALTA NESTA TEMPORADA</p>
    <div class="grid">${cardsHTML(5)}</div>
  `,
  'modal-logout': () => `
    <p class="shelf-label">// RESULTADOS PARA "DR. STONE"</p>
    <div class="grid">${cardsHTML(8)}</div>
    <div class="modal-overlay">
      <div class="modal">
        <h3>Crie sua conta</h3>
        <p>Pra salvar isso no seu Deck, você precisa de uma conta — leva menos de 1 minuto.</p>
        <a href="#" class="btn">Criar conta</a>
        <a href="#" class="btn ghost">Já tenho conta</a>
      </div>
    </div>
  `,
  'modal-login': () => `
    <p class="shelf-label">// RESULTADOS PARA "DR. STONE"</p>
    <div class="grid">${cardsHTML(8)}</div>
    <div class="modal-overlay">
      <div class="popover">
        <h4>ADICIONAR AO DECK</h4>
        <div class="opt"><span class="dot" style="background:#3FE0F0"></span> Assistindo</div>
        <div class="opt"><span class="dot" style="background:#a0ff78"></span> Em Dia</div>
        <div class="opt"><span class="dot" style="background:#FFC542"></span> Completo</div>
        <div class="opt"><span class="dot" style="background:#FF4FD8"></span> Quero Assistir</div>
      </div>
    </div>
  `
};

function render(state){
  content.innerHTML = states[state]();
  document.querySelectorAll('.demo-bar button').forEach(b => b.classList.toggle('active', b.dataset.state === state));
}

document.querySelectorAll('.demo-bar button').forEach(btn => {
  btn.addEventListener('click', () => render(btn.dataset.state));
});

render('empty');
</script>

</body>
</html>
