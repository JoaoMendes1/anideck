<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>AniDeck — Logo God Tier (Animação Ajustada)</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  body {
    background: #0A0714;
    background-image: radial-gradient(circle at 50% -20%, #201540 0%, #0A0714 60%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 80px;
    padding: 60px;
    font-family: 'JetBrains Mono', monospace;
    color: #A79BC9;
    margin: 0;
    min-height: 100vh;
  }
  .label {
    font-size: 13px;
    letter-spacing: .2em;
    margin-bottom: 30px;
    text-transform: uppercase;
    font-weight: 800;
    color: #E4DEF5;
    text-shadow: 0 0 15px rgba(63, 224, 240, 0.5);
  }
  .row {
    display: flex;
    gap: 60px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
  }
  .box {
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .box:hover {
    transform: translateY(-8px);
  }
  .checker {
    background-image: 
      linear-gradient(45deg, #161029 25%, transparent 25%),
      linear-gradient(-45deg, #161029 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #161029 75%),
      linear-gradient(-45deg, transparent 75%, #161029 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    padding: 30px;
    border-radius: 24px;
    box-shadow: inset 0 0 50px rgba(10, 7, 20, 0.9);
    border: 1px solid rgba(123, 92, 255, 0.2);
  }

  /* --- ANIMAÇÕES: respiração/piscar reduzidos, anéis mantidos como pediram --- */
  .sheen-anim-subtle {
    animation: occasionalSheen 8s ease-in-out infinite;
  }
  .spin-anim-slow {
    animation: slowSpin 40s linear infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  .spin-anim-slow-rev {
    animation: slowSpinReverse 30s linear infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  .breathe-anim {
    animation: breatheLight 7s ease-in-out infinite;
  }
  .twinkle-anim {
    animation: twinkle 6s ease-in-out infinite;
  }
  .twinkle-anim-delay {
    animation: twinkle 7s ease-in-out infinite 2s;
  }

  @keyframes occasionalSheen {
    0%, 10% { transform: translateX(-100%) skewX(-15deg); opacity: 0; }
    15% { opacity: 0.22; }
    25%, 100% { transform: translateX(200%) skewX(-15deg); opacity: 0; }
  }
  @keyframes slowSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes slowSpinReverse {
    0% { transform: rotate(360deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes breatheLight {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 1; }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.85; }
  }
</style>
</head>
