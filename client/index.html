<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniDeck · seu deck de animes</title>
    <meta name="description" content="Organize seus animes com progresso por episódio, agenda de lançamentos no seu fuso e curadoria em português." />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Prévia ao compartilhar o link (WhatsApp, LinkedIn, Discord, X). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AniDeck" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="AniDeck · seu deck de animes" />
    <meta property="og:description" content="Progresso por episódio, agenda no seu fuso e curadoria em português." />
    <meta property="og:url" content="https://anideck.joaomendes.dev.br/" />
    <meta property="og:image" content="https://anideck.joaomendes.dev.br/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://s4.anilist.co" crossorigin />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A0714" />

    <!--
      Aplica o tema salvo ANTES de qualquer pintura. Este script é inline e
      síncrono de propósito: se virasse módulo, ganhasse `defer` ou fosse parar no
      main.tsx, o navegador já teria pintado um quadro na paleta padrão e o usuário
      veria o roxo piscar antes do tema dele aparecer.

      O mapa de fundos está duplicado em src/lib/temas.ts — ver o aviso de lá.
    -->
    <script>
      (function () {
        var FUNDOS = { holo: '#0A0714', terminal: '#050A08', arquivo: '#120C08', estudio: '#12141A' }
        try {
          var id = localStorage.getItem('anideck:tema')
          if (!id || !FUNDOS[id] || id === 'holo') return
          document.documentElement.setAttribute('data-tema', id)
          document.querySelector('meta[name="theme-color"]').setAttribute('content', FUNDOS[id])
        } catch (e) {
          /* Armazenamento bloqueado: segue no tema padrão. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
